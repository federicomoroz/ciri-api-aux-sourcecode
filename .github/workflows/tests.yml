name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Tests y lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ./api
          # La version de ruff se fija: sin eso, cada release nueva puede
          # ampliar su conjunto de reglas y romper el build sin que nadie
          # haya tocado el codigo.
          pip install pytest pytest-asyncio pytest-cov "ruff==0.15.14"

      - name: Lint
        run: ruff check api/ tests/ --config api/pyproject.toml

      # Los E2E quedan fuera a proposito: llaman a la API desplegada y al
      # modelo, asi que dependen de que Render este despierto y de que haya
      # saldo. Un test que falla por algo ajeno al codigo no informa nada.
      - name: Tests
        # --cov-fail-under: sin un piso, la cobertura puede caer sin que nada
        # avise. El numero es el actual menos un margen: sube cuando sube, y
        # bajarlo tiene que ser una decision explicita en un diff.
        run: pytest tests/unit tests/integration -q --cov=api/app --cov-report=term-missing --cov-fail-under=85

      # Un workflow puede importar sin errores y no hacer nada: un Wait sin modo
      # de reanudacion es un sleep, un nodo HTTP sin reintentos desmiente al
      # mensaje de error que los promete, y un errorWorkflow que no viaja en el
      # export deja los Stop and Error sin destino. Nada de eso rompe al importar
      # y todo eso rompe en produccion, asi que se comprueba aca.
      - name: Verificar que el workflow de n8n sea importable y este cableado
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          fallas = []
          for f in sorted(Path("n8n").glob("*.json")):
              w = json.loads(f.read_text(encoding="utf-8"))
              nombres = {n["name"] for n in w["nodes"]}
              rotas = [
                  f'{origen} -> {c["node"]}'
                  for origen, salidas in w["connections"].items()
                  for rama in salidas.get("main", [])
                  for c in (rama or [])
                  if c["node"] not in nombres
              ]
              if origen_faltante := [o for o in w["connections"] if o not in nombres]:
                  rotas += [f"origen inexistente: {o}" for o in origen_faltante]
              if rotas:
                  sys.exit(f"{f.name}: conexiones rotas -> {rotas}")

              es_manejador = "errors" in f.name
              if not es_manejador and not w.get("settings", {}).get("errorWorkflow"):
                  fallas.append(f"{f.name}: sin errorWorkflow — los Stop and Error no derivan a ningun lado")

              for n in w["nodes"]:
                  if n["type"] == "n8n-nodes-base.wait" and not n["parameters"].get("resume"):
                      fallas.append(f"{f.name}: '{n['name']}' no define `resume` — es un sleep, no una compuerta humana")
                  if n["type"] == "n8n-nodes-base.httpRequest" and not n.get("retryOnFail"):
                      fallas.append(f"{f.name}: '{n['name']}' es HTTP sin retryOnFail")

              print(f"  {f.name}: {len(w['nodes'])} nodos, conexiones consistentes")

          if fallas:
              sys.exit("\n".join(["Workflows mal cableados:", *(f"  - {x}" for x in fallas)]))
          print("Cableado verificado: errorWorkflow, Wait con resume, reintentos HTTP")
          PY
